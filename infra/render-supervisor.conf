[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/tavvo-supervisord.pid
childlogdir=/tmp

[program:api]
command=gunicorn --chdir /app/apps/api config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 60
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:menu]
directory=/app/apps/public-reference
command=node /app/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:proxy]
command=nginx -c /etc/tavvo/nginx.conf -g 'daemon off;'
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
