worker_processes 1;
pid /tmp/tavvo-nginx.pid;
error_log /dev/stderr;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/tavvo-client;
    proxy_temp_path /tmp/tavvo-proxy;
    fastcgi_temp_path /tmp/tavvo-fastcgi;
    uwsgi_temp_path /tmp/tavvo-uwsgi;
    scgi_temp_path /tmp/tavvo-scgi;
    client_max_body_size 6m;

    server {
        listen 10000;
        root /app/apps/admin/dist;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Render terminates HTTPS before sending requests to this service.
        proxy_set_header X-Forwarded-Proto https;

        location ~ ^/(v1/|health/?$|ready/?$) {
            proxy_pass http://127.0.0.1:8000;
        }

        location ~ ^/(r/|q/|_next/) {
            proxy_buffering off;
            proxy_pass http://127.0.0.1:3000;
        }

        location /assets/ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
