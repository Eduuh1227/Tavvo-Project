services:
  - type: web
    name: tavvo-demo
    runtime: docker
    plan: free
    dockerfilePath: ./infra/render.Dockerfile
    healthCheckPath: /ready/
    envVars:
      - key: PORT
        value: '10000'
      - key: TAVVO_ENV
        value: demo
      - key: DATABASE_SSLMODE
        value: require
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: TAVVO_MFA_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IMAGE_STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
