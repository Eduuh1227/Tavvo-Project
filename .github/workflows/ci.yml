name: Validate foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: tavvo
          POSTGRES_PASSWORD: ephemeral_ci_owner_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tavvo"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TAVVO_ENV: development
      DATABASE_URL: postgresql://tavvo_app:ephemeral_ci_runtime_password@127.0.0.1:5432/tavvo
      MIGRATION_DATABASE_URL: postgresql://postgres:ephemeral_ci_owner_password@127.0.0.1:5432/tavvo
      TAVVO_DB_PASSWORD: ephemeral_ci_runtime_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.lock
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python scripts/configure_local.py
      - run: python infra/provision_database.py
      - run: python -m ruff check apps/api scripts infra
      - run: python scripts/manage.py migrate --noinput
      - run: python scripts/manage.py makemigrations --check --dry-run
      - run: python scripts/manage.py check
      - run: python scripts/test_backend.py -q
      - run: python scripts/manage.py spectacular --file /tmp/tavvo-openapi.yml --validate --fail-on-warn
      - run: diff -u docs/api/openapi.yaml /tmp/tavvo-openapi.yml
      - name: Validate Compose and runtime image
        run: |
          docker compose config --quiet
          docker build --file infra/api.Dockerfile --tag tavvo-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/configure_local.py
      - run: docker compose up --build -d
      - name: Validate Compose, S3, browser flows and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:admin > /tmp/tavvo-admin.log 2>&1 &
          admin_pid=$!
          npm run dev:public > /tmp/tavvo-public.log 2>&1 &
          public_pid=$!
          trap 'kill "$admin_pid" "$public_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8000/ready/ http://localhost:5173 http://localhost:3000/r/restaurante-a; do
            # A newly opened Docker port may reset the connection before Gunicorn is ready.
            # The unseeded public page may legitimately return 404 during this warmup.
            curl --silent --show-error --output /dev/null --retry 30 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 15 "$url"
          done
          curl --fail --silent http://127.0.0.1:8000/ready/
          python scripts/seed_demo.py
          python scripts/test_e2e.py
          python scripts/verify_persistence.py snapshot
          docker compose restart db api auth-mail storage
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/ready/
          python scripts/verify_persistence.py verify
      - name: Show service failures
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100 api migrate db-bootstrap storage-init auth-mail
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: playwright-report/
          retention-days: 7
      - run: docker compose stop
        if: always()
